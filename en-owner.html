<script>
  (function(){var sp=document.getElementById('splash');if(sp&&!sp.hidden){window.addEventListener('load',function(){setTimeout(function(){sp.classList.add('hide');setTimeout(function(){sp.remove()},400)},350)});}
   var pg=document.getElementById('navprog');
   document.addEventListener('click',function(e){var a=e.target.closest('a[href]');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||a.target==='_blank'||a.hasAttribute('download'))return;
     var h=a.getAttribute('href');if(!h||h[0]==='#'||/^(mailto|tel|javascript):/.test(h)||a.origin!==location.origin)return;pg.classList.add('go');});
   document.addEventListener('submit',function(e){var f=e.target;if(!f.target||f.target==='_self')setTimeout(function(){if(!e.defaultPrevented)pg.classList.add('go')},0);});
   window.addEventListener('pageshow',function(){pg.classList.remove('go')});})();
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(function(){}); }
  var end = document.getElementById('end'); if (end) end.scrollIntoView();
</script>

<script>(function(){var A={"rammah": "en-platform-0.html"}, MSG="Incorrect login details. Use one of the demo accounts.", OWNER=true;
var f=document.querySelector('form');f.addEventListener('submit',function(e){e.preventDefault();
 var u=(document.getElementById('u').value||'').trim().toLowerCase(), p=document.getElementById('p').value, cd=document.getElementById('code');
 var ok=A[u]&&p==='123456'&&(OWNER||(cd&&cd.value.trim().toLowerCase()==='alnoor'));
